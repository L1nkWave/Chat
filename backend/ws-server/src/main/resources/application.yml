server:
  port: 9090
  id: 'E1'
  instances:
    list: 'E2'
    enabled: true

spring:
  application:
    name: ws-server

  data:
    redis:
      host: 'localhost'
      port: 16379

  cloud:
    openfeign:
      okhttp:
        enabled: true

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

ws:
  session:
    exp: 10
    concurrent:
      send-time-limit: 2000
      buffer-size-limit: 10240

logging:
  level:
    org.linkwave.ws: DEBUG