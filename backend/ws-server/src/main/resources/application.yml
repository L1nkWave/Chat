server:
  port: 9090
  id: 'E1'
  instances:
    list: 'E2'
    enabled: true

spring:
  application:
    name: ws-server

  data:
    redis:
      host: 'localhost'
      port: 16379

  cloud:
    openfeign:
      okhttp:
        enabled: true

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

ws:
  # Các origin được phép mở WebSocket, cách nhau bằng dấu phẩy (biến môi trường WS_ALLOWED_ORIGINS)
  allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  session:
    exp: 10
    concurrent:
      send-time-limit: 2000
      buffer-size-limit: 10240

# Khóa dùng chung giữa ws-server và user-service (biến môi trường INTERNAL_SERVICE_KEY, tối thiểu 32 ký tự)
internal:
  service-key: ${INTERNAL_SERVICE_KEY}

logging:
  level:
    org.linkwave.ws: DEBUG