services:

  discovery-service:
    container_name: "discovery-service"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  users-db:
    container_name: "users-db"
    image: postgres:16.1-alpine
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "lw-users", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3
    env_file: .env
    environment:
      POSTGRES_DB: "lw-users"
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $USERS_DB_PASSWORD
    volumes:
      - users-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  user-service:
    container_name: "user-service"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
      users-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8082/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
    env_file: .env
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "$USERS_DB_URL",
        "spring.datasource.username": "$DB_USER",
        "spring.datasource.password": "$USERS_DB_PASSWORD",
        "spring.jpa.properties.hibernate.show_sql": true,
        "eureka.client.service-url.defaultZone": "$DISCOVERY_URL",
        "eureka.instance.prefer-ip-address": false,
        "eureka.instance.hostname": "user-service",
        "files.storage-folder": "/media"
      }'

  auth-service:
    container_name: "auth-service"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    ports:
      - "8081:8081"
    depends_on:
      user-service:
        condition: service_healthy
      redis-sessions:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 5
    env_file: .env
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "$USERS_DB_URL",
        "spring.datasource.username": "$DB_USER",
        "spring.datasource.password": "$USERS_DB_PASSWORD",
        "spring.data.redis.host": "redis-sessions",
        "spring.data.redis.port": 6379,
        "eureka.client.service-url.defaultZone": "$DISCOVERY_URL",
        "eureka.instance.prefer-ip-address": false,
        "eureka.instance.hostname": "auth-service"
      }'

  chat-db:
    container_name: 'chat-db'
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - chat-db-data:/data/db

  mongo-init:
    container_name: "mongo-init"
    image: mongo:7.0
    depends_on:
      chat-db:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host chat-db --port 27017 --quiet --eval
      "try { rs.status(); print('rs0 da ton tai') } catch (e) { printjson(rs.initiate({_id:'rs0', members:[{_id:0, host:'chat-db:27017'}]})) }"

  chat-service:
    container_name: 'chat-service'
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: chat-service
    ports:
      - "8083:8083"
    depends_on:
      chat-db:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SPRING_APPLICATION_JSON: '{
        "eureka.client.service-url.defaultZone": "$DISCOVERY_URL",
        "eureka.instance.prefer-ip-address": false,
        "eureka.instance.hostname": "chat-service",
        "files.storage-folder": "/media",
        "spring.mongodb.uri": "$CHAT_DB_URL"
      }'

  redis-sessions:
    container_name: "redis-sessions"
    image: redis:7.2.4-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 3
    env_file: .env
    environment:
      REDIS_DATABASES: 1
    restart: unless-stopped

  ws-server-1:
    container_name: "ws-server"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ws-server
    ports:
      - "9090:9090"
    depends_on:
      redis-sessions:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.data.redis.host": "redis-sessions",
        "spring.data.redis.port": 6379,
        "eureka.client.service-url.defaultZone": "$DISCOVERY_URL",
        "eureka.instance.prefer-ip-address": false,
        "eureka.instance.hostname": "ws-server",
        "server.instances.enabled": false
      }'

  # ws-server-2 đã bỏ: chạy nhiều instance làm mất tin realtime khi broadcast giữa các instance chưa hoạt động đúng.
  # Chỉ chạy một ws-server khi phát triển.

  api-gateway:
    container_name: "api-gateway"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_APPLICATION_JSON: '{
        "eureka.client.service-url.defaultZone": "$DISCOVERY_URL",
        "eureka.instance.prefer-ip-address": false,
        "eureka.instance.hostname": "api-gateway",
        "spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins": "$ORIGINS"
      }'

volumes:
  users-db-data:
  chat-db-data: