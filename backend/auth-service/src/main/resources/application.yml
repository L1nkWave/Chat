server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: 'auth-service'

  data:
    redis:
      host: 'localhost'
      port: 16379
      timeout: 1s

  datasource:
    url: 'jdbc:postgresql://localhost:15432/lw-users'
    username: 'postgres'
    password: 'postgres'
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true

    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


jwt:
  issuer: 'LW-auth'

auth:
  # true khi auth-service nằm sau api-gateway (lấy IP client từ X-Forwarded-For, dùng cho giới hạn đăng nhập theo IP).
  # Đặt false nếu auth-service mở trực tiếp ra ngoài.
  trust-forwarded-for: ${AUTH_TRUST_FORWARDED_FOR:true}

logging:
  level:
    org.linkwave.auth: INFO