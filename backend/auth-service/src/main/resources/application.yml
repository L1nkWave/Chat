server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: 'auth-service'

  datasource:
    url: 'jdbc:postgresql://localhost:15432/lw-users'
    username: 'postgres'
    password: 'postgres'
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true

    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


jwt:
  issuer: 'LW-auth'

logging:
  level:
    org.linkwave.auth: INFO