server:
  port: 8083

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

spring:
  application:
    name: 'chat-service'

  web:
    locale: en

  cloud:
    openfeign:
      okhttp:
        enabled: true

  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  # Spring Boot 4 đọc cấu hình MongoDB ở tiền tố spring.mongodb (không còn spring.data.mongodb).
  # Thuộc tính cũ bị bỏ qua, nên DB rơi về mặc định "test".
  mongodb:
    uri: 'mongodb://localhost:27017/linkwave?replicaSet=rs0'

files:
  storage-folder: '${FILE_STORAGE_FOLDER:./storage}'

logging:
  level:
    org.linkwave.chatservice: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

bot:
  # ID của tài khoản sgu_bot trong bảng users (lw-users). Lấy bằng: select id from users where username = 'sgu_bot';
  user-id: ${BOT_USER_ID:0}
internal:
  service-key: ${INTERNAL_SERVICE_KEY}