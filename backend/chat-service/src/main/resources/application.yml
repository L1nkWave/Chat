server:
  port: 8083

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

spring:
  application:
    name: 'chat-service'

  web:
    locale: en

  cloud:
    openfeign:
      okhttp:
        enabled: true

  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  data:
    mongodb:
      database: 'linkwave'
      replica-set-name: 'rs0'

files:
  storage-folder: '${FILE_STORAGE_FOLDER:./storage}'

logging:
  level:
    org.linkwave.chatservice: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG