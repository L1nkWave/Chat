server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: 'user-service'

  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  datasource:
    url: jdbc:postgresql://localhost:15432/lw-users
    username: postgres
    password: postgres

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true

    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

files:
  storage-folder: '${FILE_STORAGE_FOLDER:./storage}'