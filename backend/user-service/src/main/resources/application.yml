server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: 'user-service'

  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  datasource:
    url: jdbc:postgresql://localhost:15432/lw-users
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true

    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

files:
  storage-folder: '${FILE_STORAGE_FOLDER:./storage}'

app:
  registration-enabled: ${REGISTRATION_ENABLED:false}
  # Khóa mã hóa CCCD (AES-256) và khóa chỉ mục chống trùng (HMAC). Mỗi khóa 32 byte, mã base64.
  # Tạo bằng: openssl rand -base64 32. Thiếu khóa thì service không khởi động.
  cccd:
    key: ${CCCD_ENCRYPTION_KEY}
    index-key: ${CCCD_INDEX_KEY}

# Khóa dùng chung với ws-server (biến môi trường INTERNAL_SERVICE_KEY, tối thiểu 32 ký tự)
internal:
  service-key: ${INTERNAL_SERVICE_KEY}